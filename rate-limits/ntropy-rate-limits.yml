  note: >-
    Ntropy publishes NO runtime rate-limit signal. There are no X-RateLimit-*, RateLimit-*
    or Retry-After headers documented, and none appear on live responses. An agent cannot
    read its remaining credits, its concurrency headroom, or a back-off hint from the
    response — it can only observe the terminal status codes (429 rate limit, 423 quota
    exhausted) after the fact. The published per-endpoint ops/second table below is the
    only budget information available, and it is static documentation, not a runtime
    signal.
