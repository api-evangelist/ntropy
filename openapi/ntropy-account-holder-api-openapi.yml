          title: Type
        is_essential:
          type: boolean
          title: Is Essential
        iso_currency_code:
          type: string
          title: Iso Currency Code
        entry_type:
          type: string
          title: Entry Type
        periodicity_in_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Periodicity In Days
        average_amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Average Amount
      type: object
      required:
      - recurrence_group_id
      - latest_payment_amount
      - total_amount
      - first_payment_date
      - latest_payment_date
      - transaction_ids
      - is_active
      - latest_payment_description
      - type
      - is_essential
      - iso_currency_code
      - entry_type
      title: RecurringPaymentsGroup
      description: Represents one recurring payments group for an account holder id
    Body_patch_account_holder_v2_account_holder__account_holder_id__patch:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: Body_patch_account_holder_v2_account_holder__account_holder_id__patch
    PayFrequency:
      type: string
      enum:
      - daily
      - weekly
      - bi-weekly
      - monthly
      - bi-monthly
      - quarterly
      - semi-yearly
      - yearly
      - other
      title: PayFrequency
    TransactionType:
      type: string
      enum:
      - business
      - consumer
      - unknown
      title: TransactionType
    AccountHolderCompany:
      properties:
        loan_state:
