      type: object
      properties:
        institution:
          type:
          - string
          - 'null'
        start_date:
          type:
          - string
          - 'null'
          format: date
        end_date:
          type:
          - string
          - 'null'
          format: date
        account_holder:
          oneOf:
          - $ref: '#/components/schemas/AccountHolder'
          - type: 'null'
        accounts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Account'
      title: StatementInfo
    ValidationErrorLocItems:
      oneOf:
      - type: string
      - type: integer
      title: ValidationErrorLocItems
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      title: HTTPValidationError
    BankStatementResults:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/BankStatementAccount'
          description: List of accounts in the bank statement.
      required:
      - accounts
      title: BankStatementResults
    AccountHolder:
      type: object
      properties:
        type:
          oneOf:
          - $ref: '#/components/schemas/AccountType'
          - type: 'null'
        name:
          type:
          - string
          - 'null'
        address:
          oneOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
      title: AccountHolder
    AccountType:
