name: Ntropy
description: >-
  Ntropy provides a financial data standardization and enrichment API that turns raw
  bank transactions and bank-statement PDFs into structured, contextual data. Its
  products cover transaction enrichment (categorization, entity/merchant identification
  and recurring-payment detection), bank-statement OCR and extraction, account-holder
  ledgers, entity resolution, personalization rules, and event webhooks. The v3 REST API
  (base https://api.ntropy.com) uses API-key header auth, cursor pagination, and a
  credit-based rate model, and is used for underwriting, transaction approval, personal
  finance, customer retention and accounting. Ntropy is a fintech company backed by QED
  Investors; it ships an official Python SDK and a first-party MCP server.
