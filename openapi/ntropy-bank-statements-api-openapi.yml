          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    BankStatementFile:
      properties:
        no_pages:
          type: integer
          title: No Pages
        size:
          type: integer
          title: Size
