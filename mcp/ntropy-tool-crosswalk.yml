description: >-
  Binds every published Ntropy MCP tool to the OpenAPI operation(s) it actually calls.
  Bindings are source-verified: the stdio server's request URLs were read directly from
  src/ntropy_mcp/server.py rather than guessed from tool names, and each URL was probed
  live to confirm whether the route exists. Three tools call routes that are NOT in the
  published OpenAPI — see divergences[].
surfaces:
  openapi:
    file: openapi/_original/ntropy-api-v3-openapi-original.json
    refined: openapi/ntropy-*-openapi.yml
    base_url: https://api.ntropy.com
    regional_base_url: https://api.eu.ntropy.com
    operations: 39
    gated: false
    note: >-
      Also live and anonymously readable at https://api.ntropy.com/openapi.json — that
      URL serves the v2 "Ntropy Transaction API" (38 operations), captured separately at
      openapi/_original/ntropy-transaction-api-openapi-original.json. This crosswalk maps
      the v3 surface, which is what the MCP server calls.
  mcp_stdio:
    name: ntropy-mcp
    package: https://pypi.org/project/ntropy-mcp/
    repo: https://github.com/ntropy-network/ntropy-mcp
    install: uvx ntropy-mcp --api-key YOUR_NTROPY_API_KEY
    transport: stdio
    tools: 11
    gated: true
    note: >-
      tools/list cannot be probed remotely — the server is a local stdio process requiring
      an API key. Tool names, parameters and target URLs were read from the repository
      source, so the bindings below are exact, not semantic guesses.
  mcp_remote:
    name: fern-docs-mcp-server
    url: https://docs.ntropy.com/_mcp/server
    transport: streamable-http
    tools: 1
    gated: false
    probed: '2026-08-14'
    note: >-
      initialize + tools/list both succeed anonymously (HTTP 200, text/event-stream);
      serverInfo reports fern-docs-mcp-server 1.0.0. Documentation search only — it does
      not front the Ntropy REST API.
  graphql: null
