mcp_only:
  - tool: searchDocs
    server: fern-docs-mcp-server
    reason: >-
      Documentation search over docs.ntropy.com. No backing REST operation — it is a Fern
      docs-platform capability, not part of the Ntropy API.
    input_schema: '{ query: string (required) }'
  - tool: check_connection
    server: ntropy-mcp
    reason: >-
      Calls GET https://api.ntropy.com/v3/status, which is not in the OpenAPI and returns
      HTTP 404 on the live API (probed 2026-08-14). No REST operation to bind to. The v3
      spec has no health/status operation; the v2 spec does (health_get_health_get -> GET /health).
  - tool: set_api_key
    server: ntropy-mcp
    reason: >-
      Runtime configuration of the server's own credential; its validation step calls the
      same non-existent GET /v3/status. Not an API capability.
divergences:
  - id: v3-status-missing
    severity: high
    finding: >-
      Two of the eleven stdio tools (check_connection, set_api_key) validate against
      GET https://api.ntropy.com/v3/status. That path returns 404 on the live API — the
      same status a nonsense path such as /v3/nope returns, and unlike a real gated path
      such as /v3/account_holders which returns 403. The connectivity/credential check
      cannot succeed as written.
    evidence:
      - {url: 'https://api.ntropy.com/v3/status', method: GET, status: 404}
      - {url: 'https://api.ntropy.com/v3/account_holders', method: GET, status: 403, note: control - documented path, auth-gated}
      - {url: 'https://api.ntropy.com/v3/nope', method: GET, status: 404, note: control - absent path}
  - id: patch-account-holder-not-allowed
    severity: high
    finding: >-
      update_account_holder issues PATCH /v3/account_holders/{id}. The path exists but the
      method is rejected with 405 Method Not Allowed, and no PATCH operation appears in the
      v3 OpenAPI. The v2 API does expose PATCH /v2/account-holder/{account_holder_id}
      (patch_account_holder_v2_account_holder__account_holder_id__patch), so the tool reads
      as a v2 capability pointed at a v3 path.
    evidence:
      - {url: 'https://api.ntropy.com/v3/account_holders/test123', method: PATCH, status: 405}
      - {url: 'https://api.ntropy.com/v3/account_holders/test123', method: GET, status: 403}
  - id: transactions-bulk-undocumented
    severity: medium
    finding: >-
      POST /v3/transactions/bulk is served by the API (403 without a key) but is not
      published in the OpenAPI or the API reference. An undocumented route reachable only
      through the MCP tool is a surface divergence, not a gap to paper over.
    evidence:
      - {url: 'https://api.ntropy.com/v3/transactions/bulk', method: POST, status: 403}
  - id: stdio-only-agent-surface
    severity: medium
    finding: >-
      The only MCP server that fronts the Ntropy API is a local stdio package a human must
      install; the sole remote MCP endpoint (docs.ntropy.com/_mcp/server) searches
      documentation and cannot call the API. No agent can reach Ntropy's data plane over
      MCP without local installation.
  - id: mcp-package-decay
    severity: medium
    finding: >-
      ntropy-mcp 0.1.0 was published to PyPI on 2025-02-25 and the repository was last
      pushed 2025-03-09, while the API it wraps has moved on — which is consistent with the
      three broken/undocumented routes above.
