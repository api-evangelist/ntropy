notes: >-
  docs.ntropy.com publishes an RFC 9727 API catalog (application/linkset+json) pointing at
  the service description https://docs.ntropy.com/openapi/api-reference.yaml and the human
  reference https://docs.ntropy.com/documentation/api. It is the only real /.well-known/
  document Ntropy serves, on any host.

  No security.txt (RFC 9116) is published anywhere. No OAuth/OIDC discovery documents are
  published, which is consistent with the API's auth model — a single X-API-KEY header, no
  OAuth. The hosted docs MCP server at https://docs.ntropy.com/_mcp/server is anonymous and
  advertises no /.well-known/oauth-protected-resource, so there is no MCP authorization
  metadata to harvest.

  No A2A agent card exists at either the canonical /.well-known/agent-card.json or the
  legacy /.well-known/agent.json on any host, so no a2a/ artifact was written.
