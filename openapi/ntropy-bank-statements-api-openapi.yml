          description: The date that the transaction was posted. Uses ISO 8601 format (YYYY-MM-DD)
        entry_type:
          $ref: '#/components/schemas/EntryType-Output'
          description: The direction of the transaction (incoming or outgoing)
        amount:
          type: number
          minimum: 0.0
          title: Amount
          description: The amount of the transaction
        running_balance:
          anyOf:
          - type: number
          - type: 'null'
          title: Running Balance
        iso_currency_code:
          type: string
          title: Iso Currency Code
          description: The currency of the transaction in ISO 4217 format
        description:
          type: string
          maxLength: 1024
          minLength: 0
          title: Description
          description: The description string of the transaction
        transaction_id:
          type: string
          minLength: 1
          title: Transaction Id
          description: A unique identifier of the transaction
        page_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Number
          description: The page number this transaction appears on, where 1 is the first page.
      type: object
      required:
      - date
      - entry_type
      - amount
      - iso_currency_code
      - description
      - transaction_id
      title: BankStatementTransaction
    Address:
      properties:
        street:
          anyOf:
          - type: string
          - type: 'null'
          title: Street
        postcode:
          anyOf:
          - type: string
          - type: 'null'
          title: Postcode
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
      type: object
      title: Address
    BankStatementBankAccount:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        bank_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bank Name
        account_holder:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Holder
        account_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Number
      type: object
      title: BankStatementBankAccount
    DocumentStatus:
      type: string
      enum:
      - queued
      - processing
      - processed
      - failed
      title: DocumentStatus
    TransactionType:
      type: string
      enum:
      - business
      - consumer
      - unknown
      title: TransactionType
    AccountHolderTransactionWithErrors:
